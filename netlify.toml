[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Functions use global fetch + AbortSignal.timeout, which require a modern Node runtime.
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  node_version = "20"

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
